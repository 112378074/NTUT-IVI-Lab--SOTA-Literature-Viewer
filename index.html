<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>視覺檢測 SOTA 文獻檢視器</title>
<style>
  /* ----- Light theme (default) ----- */
  :root {
    --bg: #f6f8fc;
    --panel: #ffffff;
    --panel-2: #eef2f7;
    --panel-3: #e2e8f0;
    --border: #dde3eb;
    --text: #1a2233;
    --muted: #5e6a7d;
    --accent: #2563eb;
    --accent-2: #7c3aed;
    --ok: #15803d;
    --warn: #b45309;
    --danger: #b91c1c;

    --row-hover: #f1f5fb;
    --row-border: #e5eaf1;
    --thead-bg: #f1f5f9;
    --thead-text: #334155;
    --topbar-grad: linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
    --shadow-sm: 0 1px 3px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.04);
    --shadow-hover: 0 4px 14px rgba(37,99,235,.12), 0 2px 6px rgba(15,23,42,.06);
    --strong-text: #0f172a;
    --table-text: #334155;
    --table-muted: #475569;

    --badge-recon-bg: #ffedd5; --badge-recon-fg: #9a3412; --badge-recon-bd: #fdba74;
    --badge-nf-bg:    #dbeafe; --badge-nf-fg:    #1d4ed8; --badge-nf-bd:    #93c5fd;
    --badge-repr-bg:  #dcfce7; --badge-repr-fg:  #166534; --badge-repr-bd:  #86efac;
    --badge-aug-bg:   #fef3c7; --badge-aug-fg:   #854d0e; --badge-aug-bd:   #fde047;
    --badge-diff-bg:  #f1f5f9; --badge-diff-fg:  #334155; --badge-diff-bd:  #cbd5e1;
    --badge-purp-bg:  #f3e8ff; --badge-purp-fg:  #6b21a8; --badge-purp-bd:  #d8b4fe;
    --badge-red-bg:   #fee2e2; --badge-red-fg:   #991b1b; --badge-red-bd:   #fca5a5;

    --c-recon: #ea580c;
    --c-nf:    #2563eb;
    --c-repr:  #15803d;
    --c-aug:   #ca8a04;
    --c-diff:  #64748b;

    --c-ds-mvtec:  #2563eb;
    --c-ds-loco:   #9333ea;
    --c-ds-ad2:    #db2777;
    --c-ds-visa:   #16a34a;
    --c-ds-mpdd:   #ca8a04;
    --c-ds-btad:   #ea580c;
    --c-ds-3d:     #0891b2;

    --c-od-general:   #2563eb;
    --c-od-realtime:  #ea580c;
    --c-od-salient:   #15803d;
    --c-od-fewshot:   #9333ea;
  }

  /* ----- Dark theme (toggle) ----- */
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --panel: #161a22;
    --panel-2: #1d222c;
    --panel-3: #232936;
    --border: #2a313d;
    --text: #e6e9ef;
    --muted: #8a93a4;
    --accent: #5b9dff;
    --accent-2: #a78bfa;
    --ok: #34d399;
    --warn: #fbbf24;
    --danger: #f87171;

    --row-hover: #1a1f2a;
    --row-border: #1f242e;
    --thead-bg: #1a1f2a;
    --thead-text: #cfd5e0;
    --topbar-grad: linear-gradient(180deg, #171b25 0%, var(--bg) 100%);
    --shadow-sm: none;
    --shadow-hover: 0 4px 14px rgba(91,157,255,.15);
    --strong-text: #ffffff;
    --table-text: #d6dae3;
    --table-muted: #9aa3b3;

    --badge-recon-bg: rgba(244,162,97,.14); --badge-recon-fg: #f4a261; --badge-recon-bd: rgba(244,162,97,.35);
    --badge-nf-bg:    rgba(91,157,255,.14); --badge-nf-fg:    #5b9dff; --badge-nf-bd:    rgba(91,157,255,.35);
    --badge-repr-bg:  rgba(67,197,158,.14); --badge-repr-fg:  #43c59e; --badge-repr-bd:  rgba(67,197,158,.35);
    --badge-aug-bg:   rgba(233,184,74,.14); --badge-aug-fg:   #e9b84a; --badge-aug-bd:   rgba(233,184,74,.35);
    --badge-diff-bg:  rgba(176,182,192,.14); --badge-diff-fg: #b0b6c0; --badge-diff-bd:  rgba(176,182,192,.35);
    --badge-purp-bg:  rgba(167,139,250,.16); --badge-purp-fg: #c4b5fd; --badge-purp-bd:  rgba(167,139,250,.35);
    --badge-red-bg:   rgba(248,113,113,.16); --badge-red-fg:  #fca5a5; --badge-red-bd:   rgba(248,113,113,.35);

    --c-recon: #f4a261;
    --c-nf:    #5b9dff;
    --c-repr:  #43c59e;
    --c-aug:   #e9b84a;
    --c-diff:  #b0b6c0;

    --c-ds-mvtec:  #5b9dff;
    --c-ds-loco:   #c79bff;
    --c-ds-ad2:    #ff8db4;
    --c-ds-visa:   #43c59e;
    --c-ds-mpdd:   #e9b84a;
    --c-ds-btad:   #f4a261;
    --c-ds-3d:     #5fd4e2;

    --c-od-general:   #5b9dff;
    --c-od-realtime:  #f4a261;
    --c-od-salient:   #43c59e;
    --c-od-fewshot:   #c79bff;
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
                 "Microsoft JhengHei", "Noto Sans TC", Roboto, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; }

  .topbar {
    padding: 18px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--topbar-grad);
  }
  .topbar h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .topbar .sub { color: var(--muted); font-size: 12px; margin-left: auto; }
  .back-btn {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 13px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .crumb { color: var(--muted); font-size: 12px; }
  .crumb a { color: var(--muted); text-decoration: none; cursor: pointer; }
  .crumb a:hover { color: var(--accent); text-decoration: underline; }
  .crumb b { color: var(--text); font-weight: 500; }

  /* Topbar — area selector */
  .area-selector {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 30px 7px 12px;
    font-size: 13px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    transition: border-color .15s;
  }
  .area-selector:hover, .area-selector:focus { border-color: var(--accent); outline: none; }
  .topbar-spacer { flex: 1; }
  .theme-toggle {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: border-color .15s, background-color .15s;
  }
  .theme-toggle:hover { border-color: var(--accent); }
  .theme-toggle .icon-light, .theme-toggle .icon-dark { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-light { display: inline; }
  :root:not([data-theme="dark"]) .theme-toggle .icon-dark { display: inline; }

  main { padding: 36px 32px 60px; }

  .home-grid {
    max-width: 980px;
    margin: 28px auto 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .hero {
    max-width: 980px;
    margin: 24px auto 0;
    padding: 32px 36px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.04);
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 0% 0%, rgba(37,99,235,.08), transparent 55%),
      radial-gradient(circle at 100% 100%, rgba(124,58,237,.07), transparent 55%);
    pointer-events: none;
  }
  .hero > * { position: relative; }
  .hero .lab-tag {
    display: inline-block;
    background: var(--badge-nf-bg);
    color: var(--badge-nf-fg);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--badge-nf-bd);
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
  .hero h2 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .hero .lab-en {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 18px;
    letter-spacing: 0.3px;
  }
  .hero .lab-desc {
    color: var(--text);
    font-size: 14px;
    line-height: 1.75;
    margin: 0;
  }
  .hero .areas {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 4px 18px;
    margin: 14px 0 0;
    color: var(--text);
    font-size: 13px;
  }
  .hero .areas .a-row {
    display: flex; gap: 10px; align-items: baseline;
    padding: 5px 0;
  }
  .hero .areas .dot {
    width: 7px; height: 7px; border-radius: 50%;
    flex-shrink: 0; transform: translateY(2px);
  }
  .hero .areas b { color: var(--strong-text); font-weight: 600; }
  .hero .areas .a-row .muted { color: var(--muted); }
  .hero .contact {
    color: var(--muted);
    font-size: 12px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    margin-top: 20px;
    line-height: 1.6;
  }
  .hero .contact a { color: var(--accent); }

  .home-card {
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    text-align: left;
    color: var(--text);
    transition: transform .15s, border-color .15s, box-shadow .15s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.04);
  }
  .home-card::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 80% -20%, rgba(37,99,235,.10), transparent 60%);
    pointer-events: none;
  }
  .home-card.od::before {
    background: radial-gradient(circle at 80% -20%, rgba(124,58,237,.10), transparent 60%);
  }
  .home-card.cls::before {
    background: radial-gradient(circle at 80% -20%, rgba(22,163,74,.08), transparent 60%);
  }
  .home-card.as::before {
    background: radial-gradient(circle at 80% -20%, rgba(234,88,12,.08), transparent 60%);
  }
  .home-card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
    box-shadow: 0 4px 14px rgba(37,99,235,.12), 0 2px 6px rgba(15,23,42,.06);
  }
  .home-card.disabled {
    cursor: not-allowed;
    opacity: 0.7;
  }
  .home-card.disabled:hover {
    transform: none;
    border-color: var(--border);
    box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.04);
  }
  .home-card .soon {
    display: inline-block;
    background: var(--badge-aug-bg);
    color: var(--badge-aug-fg);
    border: 1px solid var(--badge-aug-bd);
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 8px;
    vertical-align: middle;
  }
  .home-card .tag {
    display: inline-block;
    background: var(--panel-3);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .home-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
  .home-card .desc { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .home-card .stats-line { margin-top: 18px; color: var(--muted); font-size: 12px; }
  .home-card .stats-line b { color: var(--text); }

  .menu-section { max-width: 1200px; margin: 0 auto; }
  .menu-section h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 28px 0 14px;
  }
  .menu-section h2:first-child { margin-top: 0; }
  .menu-section h3 {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    margin: 14px 0 8px;
    padding-left: 4px;
  }
  .button-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .menu-btn {
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    text-align: left;
    color: var(--text);
    transition: transform .12s, border-color .12s, box-shadow .12s;
    display: flex;
    flex-direction: column;
    gap: 6px;
    border-left-width: 4px;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .menu-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(15,23,42,.08); }
  .menu-btn .name { font-weight: 600; font-size: 14px; }
  .menu-btn .meta { color: var(--muted); font-size: 12px; }

  .menu-btn.cat-recon { border-left-color: var(--c-recon); }
  .menu-btn.cat-recon:hover { border-color: var(--c-recon); }
  .menu-btn.cat-nf    { border-left-color: var(--c-nf); }
  .menu-btn.cat-nf:hover    { border-color: var(--c-nf); }
  .menu-btn.cat-repr  { border-left-color: var(--c-repr); }
  .menu-btn.cat-repr:hover  { border-color: var(--c-repr); }
  .menu-btn.cat-aug   { border-left-color: var(--c-aug); }
  .menu-btn.cat-aug:hover   { border-color: var(--c-aug); }
  .menu-btn.cat-diff  { border-left-color: var(--c-diff); }
  .menu-btn.cat-diff:hover  { border-color: var(--c-diff); }

  .menu-btn.ds-mvtec  { border-left-color: var(--c-ds-mvtec); }
  .menu-btn.ds-loco   { border-left-color: var(--c-ds-loco); }
  .menu-btn.ds-ad2    { border-left-color: var(--c-ds-ad2); }
  .menu-btn.ds-visa   { border-left-color: var(--c-ds-visa); }
  .menu-btn.ds-mpdd   { border-left-color: var(--c-ds-mpdd); }
  .menu-btn.ds-btad   { border-left-color: var(--c-ds-btad); }
  .menu-btn.ds-3d     { border-left-color: var(--c-ds-3d); }
  .menu-btn.ds-mvtec:hover { border-color: var(--c-ds-mvtec); }
  .menu-btn.ds-loco:hover  { border-color: var(--c-ds-loco); }
  .menu-btn.ds-ad2:hover   { border-color: var(--c-ds-ad2); }
  .menu-btn.ds-visa:hover  { border-color: var(--c-ds-visa); }
  .menu-btn.ds-mpdd:hover  { border-color: var(--c-ds-mpdd); }
  .menu-btn.ds-btad:hover  { border-color: var(--c-ds-btad); }
  .menu-btn.ds-3d:hover    { border-color: var(--c-ds-3d); }

  .menu-btn.od-general  { border-left-color: var(--c-od-general); }
  .menu-btn.od-realtime { border-left-color: var(--c-od-realtime); }
  .menu-btn.od-salient  { border-left-color: var(--c-od-salient); }
  .menu-btn.od-fewshot  { border-left-color: var(--c-od-fewshot); }
  .menu-btn.od-general:hover  { border-color: var(--c-od-general); }
  .menu-btn.od-realtime:hover { border-color: var(--c-od-realtime); }
  .menu-btn.od-salient:hover  { border-color: var(--c-od-salient); }
  .menu-btn.od-fewshot:hover  { border-color: var(--c-od-fewshot); }

  .menu-btn.all {
    border-left-color: var(--accent-2);
    background: linear-gradient(135deg, var(--badge-purp-bg) 0%, var(--badge-nf-bg) 100%);
  }
  .menu-btn.all:hover { border-color: var(--accent-2); }

  .list-header {
    max-width: 1500px;
    margin: 0 auto 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  .list-header h2 { margin: 0; font-size: 18px; font-weight: 600; }
  .list-header .pill {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  .list-header .search {
    margin-left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 11px;
    color: var(--text);
    font-size: 13px;
    min-width: 240px;
  }
  .list-header .search:focus { outline: none; border-color: var(--accent); }

  .table-wrap {
    max-width: 1500px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(15,23,42,.04), 0 4px 12px rgba(15,23,42,.04);
  }
  .table-scroll { overflow: auto; max-height: calc(100vh - 220px); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    position: sticky; top: 0;
    background: var(--thead-bg);
    color: var(--thead-text);
    font-weight: 600;
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
    z-index: 2;
  }
  thead th.metric { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--row-border); transition: background-color .12s; }
  tbody tr:hover { background: var(--row-hover); }
  td { padding: 9px 12px; vertical-align: top; color: var(--table-text); }
  td.metric { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  td.method { font-weight: 600; color: var(--strong-text); min-width: 200px; }
  td.rank { color: var(--muted); width: 36px; text-align: right; }
  td.rank.gold   { color: #b45309; font-weight: 700; }
  td.rank.silver { color: var(--muted); font-weight: 700; }
  td.rank.bronze { color: #92400e; font-weight: 700; }
  td.notes { max-width: 380px; color: var(--table-muted); font-size: 12px; line-height: 1.5; }
  td.long-ap { max-width: 320px; white-space: normal; font-size: 12px; color: var(--table-muted); }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .cat-badge.cat-recon { background: var(--badge-recon-bg); color: var(--badge-recon-fg); border-color: var(--badge-recon-bd); }
  .cat-badge.cat-nf    { background: var(--badge-nf-bg);    color: var(--badge-nf-fg);    border-color: var(--badge-nf-bd); }
  .cat-badge.cat-repr  { background: var(--badge-repr-bg);  color: var(--badge-repr-fg);  border-color: var(--badge-repr-bd); }
  .cat-badge.cat-aug   { background: var(--badge-aug-bg);   color: var(--badge-aug-fg);   border-color: var(--badge-aug-bd); }
  .cat-badge.cat-diff  { background: var(--badge-diff-bg);  color: var(--badge-diff-fg);  border-color: var(--badge-diff-bd); }

  .cat-badge.od-general  { background: var(--badge-nf-bg);    color: var(--badge-nf-fg);    border-color: var(--badge-nf-bd); }
  .cat-badge.od-realtime { background: var(--badge-recon-bg); color: var(--badge-recon-fg); border-color: var(--badge-recon-bd); }
  .cat-badge.od-salient  { background: var(--badge-repr-bg);  color: var(--badge-repr-fg);  border-color: var(--badge-repr-bd); }
  .cat-badge.od-fewshot  { background: var(--badge-purp-bg);  color: var(--badge-purp-fg);  border-color: var(--badge-purp-bd); }

  .status-pub  { background: var(--badge-repr-bg); color: var(--badge-repr-fg); border-color: var(--badge-repr-bd); }
  .status-pre  { background: var(--badge-aug-bg);  color: var(--badge-aug-fg);  border-color: var(--badge-aug-bd); }
  .status-rev  { background: var(--badge-red-bg);  color: var(--badge-red-fg);  border-color: var(--badge-red-bd); }

/* ====== Helpers ====== */
function adCategoryClass(cat) {
  if (!cat) return '';
  if (cat.includes('重構')) return 'cat-recon';
  if (cat.includes('NF')) return 'cat-nf';
  if (cat.includes('表徵')) return 'cat-repr';
  if (cat.includes('資料擴增')) return 'cat-aug';
  if (cat.includes('擴散')) return 'cat-diff';
  return '';
}
function adCategoryLabel(cat) {
  const m = AD_CATEGORIES.find(c => c.key === cat);
  return m ? m.label : cat || '';
}
function odCategoryClass(cat) {
  const m = OD_CATEGORIES.find(c => c.key === cat);
  return m ? m.cls : '';
}
function statusClass(s) {
  if (!s) return 'status-tbd';
  const t = String(s).trim();
  if (t === '已發表' || t === 'Published') return 'status-pub';
  if (t === '預印本' || t === 'Preprint') return 'status-pre';
  if (t === '在審' || t.toLowerCase().includes('review')) return 'status-rev';
  if (t === 'Reproduced') return 'status-rep';
  return 'status-tbd';
}
function fmtNum(v, digits = 1) {
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'string' && /to verify/i.test(v)) return '—';
  const n = parseFloat(v);
  return Number.isNaN(n) ? '—' : n.toFixed(digits);
}
function fmtCell(v) {
  if (v === null || v === undefined || v === '') return '—';
  return String(v);
}
function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function adSortByMetric(rows) {
  return rows.slice().sort((a, b) => {
    const ai = (a.i_auroc === null || a.i_auroc === undefined || a.i_auroc === '') ? -Infinity : parseFloat(a.i_auroc);
    const bi = (b.i_auroc === null || b.i_auroc === undefined || b.i_auroc === '') ? -Infinity : parseFloat(b.i_auroc);
    if (ai !== bi) return bi - ai;
    const ap = (a.p_auroc === null || a.p_auroc === undefined || a.p_auroc === '') ? -Infinity : parseFloat(a.p_auroc);
    const bp = (b.p_auroc === null || b.p_auroc === undefined || b.p_auroc === '') ? -Infinity : parseFloat(b.p_auroc);
    return bp - ap;
  });
}

function odSortByMetric(rows) {
  return rows.slice().sort((a, b) => {
    const am = (a.mAP === null || a.mAP === undefined || a.mAP === '') ? NaN : parseFloat(a.mAP);
    const bm = (b.mAP === null || b.mAP === undefined || b.mAP === '') ? NaN : parseFloat(b.mAP);
    const aHas = !Number.isNaN(am);
    const bHas = !Number.isNaN(bm);
    if (aHas && bHas) {
      if (am !== bm) return bm - am;
    } else if (aHas !== bHas) {
      return aHas ? -1 : 1;
    }
    const da = a.date || '';
    const db = b.date || '';
    if (da !== db) return da < db ? 1 : -1;
    return 0;
  });
}

function sortByDateDesc(rows) {
  return rows.slice().sort((a, b) => {
    const da = a.date || '';
    const db = b.date || '';
    if (da === db) return (a.method || '').localeCompare(b.method || '');
    return da < db ? 1 : -1;
  });
}

function dedupeByMethodAD(rows) {
  const map = new Map();
  rows.forEach(r => {
    const k = r.method;
    if (!k) return;
    const existing = map.get(k);
    const score = ['i_auroc','p_auroc','p_ap','p_pro','fps']
      .reduce((acc, key) => acc + ((r[key] !== null && r[key] !== undefined && r[key] !== '') ? 1 : 0), 0);
    if (!existing || score > existing._score) map.set(k, { ...r, _score: score });
  });
  return [...map.values()].map(r => { const { _score, ...rest } = r; return rest; });
}

/* ====== Routing ====== */
const state = {
  view: 'home',
  listType: null,
  listKey: null,
  query: '',
  dsFilter: '',  // dataset filter inside category-view
};

function navigate(view, opts = {}) {
  state.view = view;
  state.listType = opts.listType || null;
  state.listKey = opts.listKey || null;
  state.query = '';
  state.dsFilter = opts.dsFilter || '';
  let hash = '';
  if (view === 'list') {
    hash = `${view}/${opts.listType}/${encodeURIComponent(opts.listKey || '')}`;
    if (state.dsFilter) hash += '/' + encodeURIComponent(state.dsFilter);
  } else if (view !== 'home') hash = view;
  history.replaceState(null, '', hash ? '#' + hash : '#');
  render();
}

window.addEventListener('hashchange', parseHash);
function parseHash() {
  const h = location.hash.replace(/^#/, '');
  if (!h) { state.view = 'home'; render(); return; }
  const parts = h.split('/');
  if (['ad','od','cls','as'].includes(parts[0])) {
    state.view = parts[0];
  } else if (parts[0] === 'list' && parts[1]) {
    state.view = 'list';
    state.listType = parts[1];
    state.listKey = decodeURIComponent(parts[2] || '');
    state.dsFilter = parts[3] ? decodeURIComponent(parts[3]) : '';
  } else {
    state.view = 'home';
  }
  render();
}

/* ====== Renderers ====== */
function homeLink() { return '<a data-nav="home">首頁</a>'; }

function render() {
  const app = document.getElementById('app');
  const back = document.getElementById('back');
  const crumb = document.getElementById('crumb');
  const title = document.getElementById('page-title');
  const areaSel = document.getElementById('area-selector');

  if (state.view === 'home') {
    back.style.display = 'none';
    title.textContent = '視覺檢測 SOTA 文獻檢視器';
    crumb.innerHTML = '請選擇研究領域';
    if (areaSel) areaSel.value = '';
    app.innerHTML = renderHome();
  } else if (state.view === 'ad') {
    back.style.display = '';
    back.onclick = () => navigate('home');
    title.textContent = 'Anomaly Detection (異常檢測)';
    crumb.innerHTML = `${homeLink()} ▸ Anomaly Detection`;
    if (areaSel) areaSel.value = 'ad';
    app.innerHTML = renderADMenu();
  } else if (state.view === 'od') {
    back.style.display = '';
    back.onclick = () => navigate('home');
    title.textContent = 'Object Detection (物件偵測)';
    crumb.innerHTML = `${homeLink()} ▸ Object Detection`;
    if (areaSel) areaSel.value = 'od';
    app.innerHTML = renderODMenu();
  } else if (state.view === 'cls') {
    back.style.display = '';
    back.onclick = () => navigate('home');
    title.textContent = 'Classification (影像分類)';
    crumb.innerHTML = `${homeLink()} ▸ Classification`;
    if (areaSel) areaSel.value = 'cls';
    app.innerHTML = renderClsPlaceholder();
  } else if (state.view === 'as') {
    back.style.display = '';
    back.onclick = () => navigate('home');
    title.textContent = 'Anomaly Synthesis (影像異常合成)';
    crumb.innerHTML = `${homeLink()} ▸ Anomaly Synthesis`;
    if (areaSel) areaSel.value = 'as';
    app.innerHTML = renderASPlaceholder();
  } else if (state.view === 'list') {
    back.style.display = '';
    const isOD = state.listType && state.listType.startsWith('od-');
    back.onclick = () => navigate(isOD ? 'od' : 'ad');
    title.textContent = isOD ? 'Object Detection' : 'Anomaly Detection';
    crumb.innerHTML = `${homeLink()} ▸ <a data-nav="${isOD ? 'od' : 'ad'}">${isOD ? 'Object Detection' : 'Anomaly Detection'}</a> ▸ 列表`;
    if (areaSel) areaSel.value = isOD ? 'od' : 'ad';
    app.innerHTML = renderList();
  }
  bindAfterRender();
}

function renderADMenu() {
  const catCounts = {};
  AD_CATEGORIES.forEach(c => {
    catCounts[c.key] = new Set(AD_RAW.filter(r => r.category === c.key).map(r => r.method)).size;
  });
  const dsCounts = {};
  AD_DATASETS.forEach(d => { dsCounts[d.key] = AD_RAW.filter(r => r.dataset === d.key).length; });
  const totalMethods = new Set(AD_RAW.map(r => r.method)).size;

  const catBtns = AD_CATEGORIES.map(c => `
    <button class="menu-btn ${c.cls}" data-list="category" data-key="${escapeHtml(c.key)}">
      <span class="name">${escapeHtml(c.label)}</span>
      <span class="meta">${escapeHtml(c.en)} · ${catCounts[c.key]} 方法</span>
    </button>
  `).join('');
  const dsBtns = AD_DATASETS.map(d => `
    <button class="menu-btn ${d.cls}" data-list="dataset" data-key="${escapeHtml(d.key)}">
      <span class="name">${escapeHtml(d.label)}</span>
      <span class="meta">${escapeHtml(d.desc)} · ${dsCounts[d.key]} 筆</span>
    </button>
  `).join('');

  return `
    <div class="menu-section">
      <h2>方法類別 (5 Based)</h2>
      <div class="button-grid">${catBtns}</div>
      <h2>資料集 (7 Datasets)</h2>
      <div class="button-grid">${dsBtns}</div>
      <h2>全部論文</h2>
      <div class="button-grid">
        <button class="menu-btn all" data-list="all" data-key="all">
          <span class="name">All Papers</span>
          <span class="meta">不分類別 / 不分資料集，共 ${totalMethods} 個獨立方法 · 依年月新→舊</span>
        </button>
      </div>
    </div>
  `;
}

function renderODMenu() {
  const catCounts = {};
  OD_CATEGORIES.forEach(c => {
    catCounts[c.key] = new Set(OD_DATA.all_papers.filter(r => r.category === c.key).map(r => r.method)).size;
  });
  const dsCount = {};
  OD_DATA.rows.forEach(r => { dsCount[r.dataset] = (dsCount[r.dataset] || 0) + 1; });

  const dsByCat = {};
  Object.entries(OD_DATA.dataset_category_map).forEach(([ds, cat]) => {
    if (!dsByCat[cat]) dsByCat[cat] = [];
    dsByCat[cat].push(ds);
  });

  const totalMethods = new Set(OD_DATA.all_papers.map(r => r.method)).size;

  const catBtns = OD_CATEGORIES.map(c => `
    <button class="menu-btn ${c.cls}" data-list="od-category" data-key="${escapeHtml(c.key)}">
      <span class="name">${escapeHtml(c.label)}</span>
      <span class="meta">${escapeHtml(c.desc)} · ${catCounts[c.key] || 0} 方法</span>
    </button>
  `).join('');

  const datasetSections = OD_CATEGORIES.map(cat => {
    const list = dsByCat[cat.key] || [];
    if (list.length === 0) return '';
    const btns = list.map(ds => `
      <button class="menu-btn ${cat.cls}" data-list="od-dataset" data-key="${escapeHtml(ds)}">
        <span class="name">${escapeHtml(ds)}</span>
        <span class="meta">${escapeHtml(cat.label)} · ${dsCount[ds] || 0} 筆</span>
      </button>
    `).join('');
    return `
      <h3>${escapeHtml(cat.label)} 資料集 (${list.length})</h3>
      <div class="button-grid">${btns}</div>
    `;
  }).join('');

  return `
    <div class="menu-section">
      <h2>方法類別 (4 Categories)</h2>
      <div class="button-grid">${catBtns}</div>
      <h2>資料集 (${OD_DATA.datasets.length} Datasets)</h2>
      ${datasetSections}
      <h2>全部論文</h2>
      <div class="button-grid">
        <button class="menu-btn all" data-list="od-all" data-key="all">
          <span class="name">All Papers</span>
          <span class="meta">不分類別 / 不分資料集，共 ${totalMethods} 個獨立方法 · 依年月新→舊</span>
        </button>
      </div>
    </div>
  `;
}

function renderList() {
  const { listType, listKey } = state;
  let rows, mode, title, subTitle;

  if (listType === 'category') {
    const meta = AD_CATEGORIES.find(c => c.key === listKey);
    let pool = AD_RAW.filter(r => r.category === listKey);
    if (state.dsFilter) pool = pool.filter(r => r.dataset === state.dsFilter);
    rows = adSortByMetric(pool);
    mode = 'ad-metrics';
    title = meta ? meta.label : listKey;
    subTitle = meta ? meta.en : '';
  } else if (listType === 'dataset') {
    const meta = AD_DATASETS.find(d => d.key === listKey);
    rows = adSortByMetric(AD_RAW.filter(r => r.dataset === listKey));
    mode = 'ad-metrics';
    title = `資料集：${meta ? meta.label : listKey}`;
    subTitle = meta ? meta.desc : '';
  } else if (listType === 'all') {
    rows = sortByDateDesc(dedupeByMethodAD(AD_RAW));
    mode = 'ad-all';
    title = 'All Papers (Anomaly Detection)';
    subTitle = '不分類別 / 資料集，依年月新→舊排序';
  } else if (listType === 'od-category') {
    const meta = OD_CATEGORIES.find(c => c.key === listKey);
    let pool = OD_DATA.rows.filter(r => r.category === listKey);
    if (state.dsFilter) pool = pool.filter(r => r.dataset === state.dsFilter);
    rows = odSortByMetric(pool);
    mode = 'od-metrics';
    title = meta ? meta.label : listKey;
    subTitle = meta ? meta.desc : '';
  } else if (listType === 'od-dataset') {
    rows = odSortByMetric(OD_DATA.rows.filter(r => r.dataset === listKey));
    mode = 'od-metrics';
    title = `資料集：${listKey}`;
    const cat = OD_DATA.dataset_category_map[listKey];
    subTitle = cat ? `分類：${cat}` : '';
  } else if (listType === 'od-all') {
    rows = sortByDateDesc(OD_DATA.all_papers);
    mode = 'od-all';
    title = 'All Papers (Object Detection)';
    subTitle = '不分類別 / 資料集，依年月新→舊排序';
  }

  const q = state.query.trim().toLowerCase();
  const filtered = q
    ? rows.filter(r => [r.method, r.authors, r.notes, r.venue, r.dataset].filter(Boolean).join(' ').toLowerCase().includes(q))
    : rows;

  const sortHint = (mode === 'ad-metrics')
    ? '排序：I-AUROC 高→低；相同則 P-AUROC 高→低'
    : (mode === 'od-metrics')
      ? '排序：mAP 高→低；無數值或相同則年月新→舊'
      : '排序：年月新→舊';

  let head, body;
  if (mode === 'ad-metrics') {
    head = `
      <tr>
        <th>#</th>
        <th>方法</th>
        ${listType === 'category' ? '<th>資料集</th>' : '<th>類別</th>'}
        <th>發表</th><th>年月</th><th>狀態</th>
        <th class="metric">I-AUROC</th><th class="metric">P-AUROC</th>
        <th class="metric">P-AP</th><th class="metric">P-PRO</th><th class="metric">FPS</th>
        <th>連結</th><th>GitHub</th>
      </tr>`;
    body = filtered.length === 0
      ? `<tr><td colspan="13" class="empty">沒有符合條件的論文</td></tr>`
      : filtered.map((r, i) => renderADRow(r, i, listType)).join('');
  } else if (mode === 'ad-all') {
    head = `
      <tr>
        <th>#</th><th>方法</th><th>類別</th>
        <th>發表</th><th>年月</th><th>狀態</th>
        <th>連結</th><th>GitHub</th>
      </tr>`;
    body = filtered.length === 0
      ? `<tr><td colspan="8" class="empty">沒有符合條件的論文</td></tr>`
      : filtered.map((r, i) => renderADRowAll(r, i)).join('');
  } else if (mode === 'od-metrics') {
    head = `
      <tr>
        <th>#</th>
        <th>方法</th>
        ${listType === 'od-category' ? '<th>資料集</th>' : '<th>類別</th>'}
        <th>發表</th><th>年月</th><th>狀態</th>
        <th class="metric">mAP</th><th>AP / metric</th>
        <th class="metric">FPS</th><th class="metric">params</th>
        <th>連結</th><th>GitHub</th>
      </tr>`;
    body = filtered.length === 0
      ? `<tr><td colspan="12" class="empty">沒有符合條件的論文</td></tr>`
      : filtered.map((r, i) => renderODRow(r, i, listType)).join('');
  } else if (mode === 'od-all') {
    head = `
      <tr>
        <th>#</th><th>類別</th><th>方法</th><th>作者</th>
        <th>發表</th><th>年月</th><th>備註</th>
        <th>連結</th><th>GitHub</th>
      </tr>`;
    body = filtered.length === 0
      ? `<tr><td colspan="9" class="empty">沒有符合條件的論文</td></tr>`
      : filtered.map((r, i) => renderODRowAll(r, i)).join('');
  }

  // Optional dataset-filter dropdown (only for category views, where same model can recur across datasets)
  let dsFilterHtml = '';
  if (listType === 'category') {
    const datasetsInPool = [...new Set(AD_RAW.filter(r => r.category === listKey).map(r => r.dataset))].sort();
    dsFilterHtml = `
      <select class="search" id="ds-filter" title="篩選資料集">
        <option value="">全部資料集 (${datasetsInPool.length})</option>
        ${datasetsInPool.map(d => `<option value="${escapeHtml(d)}" ${state.dsFilter === d ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
      </select>`;
  } else if (listType === 'od-category') {
    const datasetsInPool = [...new Set(OD_DATA.rows.filter(r => r.category === listKey).map(r => r.dataset))].sort();
    dsFilterHtml = `
      <select class="search" id="ds-filter" title="篩選資料集">
        <option value="">全部資料集 (${datasetsInPool.length})</option>
        ${datasetsInPool.map(d => `<option value="${escapeHtml(d)}" ${state.dsFilter === d ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
      </select>`;
  }

  return `
    <div class="list-header">
      <h2>${escapeHtml(title)}</h2>
      ${subTitle ? `<span class="pill">${escapeHtml(subTitle)}</span>` : ''}
      <span class="pill">${filtered.length} 筆</span>
      <span class="pill">${escapeHtml(sortHint)}</span>
      ${dsFilterHtml}
      <input class="search" id="search" type="search" placeholder="搜尋方法 / 作者 / 備註…" value="${escapeHtml(state.query)}" />
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>${head}</thead>
          <tbody>${body}</tbody>
        </table>
      </div>
    </div>
  `;
}

function rankCls(rank) {
  return rank === 1 ? 'gold' : rank === 2 ? 'silver' : rank === 3 ? 'bronze' : '';
}
function arxivBtn(link) {
  return link ? `<a class="link-btn" href="${escapeHtml(link)}" target="_blank" rel="noopener">論文 ↗</a>` : '<span style="color:var(--muted)">—</span>';
}
function ghBtn(gh) {
  return gh ? `<a class="link-btn" href="${escapeHtml(gh)}" target="_blank" rel="noopener">GitHub ↗</a>` : '<span style="color:var(--muted)">—</span>';
}

function renderADRow(r, i, listType) {
  const rank = i + 1;
  const catCls = adCategoryClass(r.category);
  const statCls = statusClass(r.status);
  const middle = listType === 'category'
    ? `<td>${escapeHtml(r.dataset || '')}</td>`
    : `<td><span class="badge cat-badge ${catCls}">${escapeHtml(adCategoryLabel(r.category))}</span></td>`;
  return `
    <tr>
      <td class="rank ${rankCls(rank)}">${rank}</td>
      <td class="method" title="${escapeHtml(r.notes || '')}">${escapeHtml(r.method || '')}</td>
      ${middle}
      <td>${escapeHtml(r.venue || '')}</td>
      <td>${escapeHtml(r.date || '')}</td>
      <td><span class="badge ${statCls}">${escapeHtml(r.status || '—')}</span></td>
      <td class="metric">${fmtNum(r.i_auroc)}</td>
      <td class="metric">${fmtNum(r.p_auroc)}</td>
      <td class="metric">${fmtNum(r.p_ap)}</td>
      <td class="metric">${fmtNum(r.p_pro)}</td>
      <td class="metric">${fmtNum(r.fps)}</td>
      <td>${arxivBtn(r.link)}</td>
      <td>${ghBtn(r.github)}</td>
    </tr>`;
}
function renderADRowAll(r, i) {
  const catCls = adCategoryClass(r.category);
  const statCls = statusClass(r.status);
  return `
    <tr>
      <td class="rank">${i + 1}</td>
      <td class="method" title="${escapeHtml(r.notes || '')}">${escapeHtml(r.method || '')}</td>
      <td><span class="badge cat-badge ${catCls}">${escapeHtml(adCategoryLabel(r.category))}</span></td>
      <td>${escapeHtml(r.venue || '')}</td>
      <td>${escapeHtml(r.date || '')}</td>
      <td><span class="badge ${statCls}">${escapeHtml(r.status || '—')}</span></td>
      <td>${arxivBtn(r.link)}</td>
      <td>${ghBtn(r.github)}</td>
    </tr>`;
}

  const middle = listType === 'od-category'
    ? `<td>${escapeHtml(r.dataset || '')}</td>`
    : `<td><span class="badge cat-badge ${catCls}">${escapeHtml(r.category || '—')}</span></td>`;

    <tr>
      <td class="rank ${rankCls(rank)}">${rank}</td>
      <td class="method" title="${escapeHtml(r.notes || '')}">${escapeHtml(r.method || '')}</td>
      ${middle}
      <td>${escapeHtml(r.venue || '')}</td>
      <td>${escapeHtml(r.date || '')}</td>
      <td><span class="badge ${statCls}">${escapeHtml(r.status || '—')}</span></td>
      <td class="metric">${fmtNum(r.mAP)}</td>
      <td class="long-ap">${escapeHtml(fmtCell(r.AP))}</td>
      <td class="metric">${escapeHtml(fmtCell(r.FPS))}</td>
      <td class="metric">${escapeHtml(fmtCell(r.params))}</td>
      <td>${arxivBtn(r.link)}</td>
      <td>${ghBtn(r.github)}</td>
    </tr>`;

      <td class="rank">${i + 1}</td>
      <td><span class="badge cat-badge ${catCls}">${escapeHtml(r.category || '—')}</span></td>
      <td class="method">${escapeHtml(r.method || '')}</td>
      <td>${escapeHtml(r.authors || '—')}</td>
      <td>${escapeHtml(r.venue || '')}</td>
      <td>${escapeHtml(r.date || '')}</td>
      <td class="notes">${escapeHtml(r.notes || '—')}</td>
      <td>${arxivBtn(r.link)}</td>
      <td>${ghBtn(r.github)}</td>
    </tr>`;
}

function bindAfterRender() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.nav));
  });
  document.querySelectorAll('[data-list]').forEach(el => {
    el.addEventListener('click', () => navigate('list', { listType: el.dataset.list, listKey: el.dataset.key }));
  });
  const s = document.getElementById('search');
  if (s) {
    s.addEventListener('input', e => {
      state.query = e.target.value;
      const app = document.getElementById('app');
      app.innerHTML = renderList();
      bindAfterRender();
      const ns = document.getElementById('search');
      if (ns) {
        ns.focus();
        const v = ns.value;
        ns.setSelectionRange(v.length, v.length);
      }
    });
  }
  const dsf = document.getElementById('ds-filter');
  if (dsf) {
    dsf.addEventListener('change', e => {
      state.dsFilter = e.target.value;
      const app = document.getElementById('app');
      app.innerHTML = renderList();
      bindAfterRender();
      // Update URL hash to keep filter
      let hash = `list/${state.listType}/${encodeURIComponent(state.listKey)}`;
      if (state.dsFilter) hash += '/' + encodeURIComponent(state.dsFilter);
      history.replaceState(null, '', '#' + hash);
    });
  }
}

/* ====== Topbar controls (persistent across renders) ====== */
function initTopbarControls() {
  // Theme toggle (persisted in localStorage)
  const saved = localStorage.getItem('theme');
  if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  const tt = document.getElementById('theme-toggle');
  if (tt) {
    tt.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      if (cur === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  }
  // Area selector (always visible in topbar)
  const sel = document.getElementById('area-selector');
  if (sel) {
    sel.addEventListener('change', e => {
      const v = e.target.value;
      if (v) navigate(v);
    });
  }
}

initTopbarControls();
parseHash();
</script>
